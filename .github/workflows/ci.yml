# Runs on every push and pull request. Uses no secrets and no network beyond
# package registries: every test runs on stub providers (CLAUDE.md).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, tests)
    runs-on: ubuntu-latest  # service containers need a Linux runner
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loi25
          POSTGRES_PASSWORD: loi25
          POSTGRES_DB: loi25
        options: >-
          --health-cmd "pg_isready -U loi25 -d loi25"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          # Same host port as docker-compose.yml, so the app's default
          # DATABASE_URL works unchanged.
          - 5433:5432
    env:
      EMBEDDING_PROVIDER: stub
      LLM_PROVIDER: stub
      REQUIRE_DB: "1"  # database tests must run here, never skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e "backend[dev]"
      - name: Lint
        run: |
          ruff check backend scripts evals
          ruff format --check backend scripts evals
      - name: Tests
        working-directory: backend
        run: python -m pytest -rs

  frontend:
    name: frontend (lint, types, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  eval-assertions:
    name: eval assertions (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The assertion libraries use only Node built-ins: no npm install needed.
      - name: Tests
        working-directory: evals
        run: node --test "lib/**/*.test.js"
