# Runs the promptfoo suites against the real model. Costs money, so it is
# manual or weekly, never on push. Needs the repository secret ANTHROPIC_API_KEY;
# without it the workflow stops early with a notice instead of failing.
#
#   scope=baseline  one configuration, both suites       (~0.2 USD, ~4 min)
#   scope=matrix    baseline + 4 mitigations + all four  (~1 USD, ~20 min)
#
# Results are uploaded as an artifact and the comparison table is written to
# the job summary. Nothing is committed back: the README cites dated runs.
name: evals

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "baseline (one config, ~0.2 USD) or matrix (six configs, ~1 USD)"
        type: choice
        options: [baseline, matrix]
        default: baseline
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC, baseline only

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the evals."
          fi

  evals:
    needs: check-secret
    if: needs.check-secret.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loi25
          POSTGRES_PASSWORD: loi25
          POSTGRES_DB: loi25
        options: >-
          --health-cmd "pg_isready -U loi25 -d loi25"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: anthropic
      ANTHROPIC_MODEL: claude-haiku-5-5
      EMBEDDING_PROVIDER: fastembed
      SCOPE: ${{ inputs.scope || 'baseline' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set run date and labels
        run: |
          echo "DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          if [ "$SCOPE" = "matrix" ]; then
            echo "LABELS=baseline acl isolate toolguard outfilter all" >> "$GITHUB_ENV"
          else
            echo "LABELS=baseline" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The scripts call ../.venv/bin/..., as on a developer machine.
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "backend[dev]"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - name: Install promptfoo
        working-directory: evals
        run: npm ci

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2-v1

      # The law text is not committed (licensing unclear). The downloaded HTML
      # is cached so later runs use the same version and do not depend on
      # LégisQuébec accepting requests from CI runners.
      - name: Cache the downloaded law
        uses: actions/cache@v6
        with:
          path: data/raw
          key: legisquebec-P-39.1-v1

      - name: Fetch and parse the corpus
        run: .venv/bin/python scripts/fetch_corpus.py

      - name: Ingest
        working-directory: backend
        run: ../.venv/bin/python -m app.ingest ../data

      - name: Run the suites
        working-directory: evals
        run: ./run_matrix.sh

      - name: Job summary
        if: always()
        working-directory: evals
        run: |
          if [ -f "results/${DATE}-comparison.md" ]; then
            cat "results/${DATE}-comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ env.DATE }}-${{ env.SCOPE }}
          path: |
            evals/results/${{ env.DATE }}-*
            evals/.matrix-logs/
          retention-days: 90
          if-no-files-found: warn

      # Gate only what must never regress: controls (employee access, legitimate
      # email) pass every attempt, and no case errored. Accuracy and attack pass
      # rates are reported above, not gated.
      - name: Gate
        working-directory: evals
        run: ../.venv/bin/python compare.py --date "$DATE" --labels "${LABELS// /,}" --gate
