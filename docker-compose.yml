services:
  db:
    image: pgvector/pgvector:pg16
    container_name: loi25-db
    environment:
      POSTGRES_USER: loi25
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loi25}
      POSTGRES_DB: loi25
    ports:
      # 5433 on the host so it does not clash with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - loi25-pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created. The app also applies the
      # same file idempotently (app.db.apply_schema), so both paths agree.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loi25 -d loi25"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loi25-pgdata:
